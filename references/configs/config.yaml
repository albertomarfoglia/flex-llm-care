# configs/config.yaml — default experiment (read by notebooks/run.ipynb and scripts/run_experiment.py)
# Relative paths are resolved against the repository root.
project_name: "FHIR Classification"
experiment_name: "baseline"
seed: 42

dataset:
  name: "motu_enriched.csv"            # relative to data/ (e.g. "mimic_enriched.csv", "sphn/sphn.csv")

retrieval:
  embeddings: "abhinand/MedEmbed-large-v0.1"
  embeddings_revision: "963121bfb9c625475f65b08fb54990ce9c4e7a1a"
  k: 6
  every_represented_candidate: true
  chunk_size: 6
  index_path: "models/faiss_index"     # rebuilt automatically if docs/embeddings/chunk_size change

model:
  name: "Qwen/Qwen2.5-72B-Instruct"
  revision: "495f39366efef23836d0cfae4fbe635880d2be31"
  n_output: 3
  prompt_template: "references/configs/prompts/prompt_top_3.txt"
  decoding: "greedy"                   # "greedy" (deterministic) or "model_default" (model's generation_config)
  max_new_tokens: 50
  cache_dir: null                      # null = standard HuggingFace cache ($HF_HOME)
